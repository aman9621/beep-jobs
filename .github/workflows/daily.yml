name: Daily Job Refresh

on:
  schedule:
    # Runs daily at 02:00 UTC (07:30 AM IST)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write # Needed to commit and push updated jobs.json and data/usage_log.json

jobs:
  refresh-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run job refresh pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-1.5-flash' }}
          # Adzuna is completely optional (leave unset if you don't use Adzuna)
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID || '' }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY || '' }}
        run: node refresh.js

      - name: Commit and push changes if updated
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add jobs.json data/usage_log.json || true
          if git diff --staged --quiet; then
            echo "No new jobs or updates detected. Nothing to commit."
          else
            git commit -m "chore(data): automated daily refresh [skip ci]"
            git push
            echo "Successfully updated jobs.json and pushed to repository."
          fi
